[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generate-baselines-mila"
version = "0.1.0"
description = "Cluster-ready baseline utterance generation for communicative-efficiency analyses."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Nicolas Goulet", email = "nicolas.goulet@hec.ca"}
]
dependencies = []

[project.optional-dependencies]
transformers = [
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
  "tokenizers>=0.20,<0.22",
  "safetensors>=0.4,<1",
]

[project.scripts]
generate-baselines-mila = "generate_baselines_mila.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
